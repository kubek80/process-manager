# Local development database. `npm run dev` starts it for you.
# Same major version as the cloud database should be; change both together.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm
      POSTGRES_DB: pm_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pm-db:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pm-db:
